function fit(el,max,min){var s=max;el.style.fontSize=s+'px';while(el.scrollWidth>470&&s>min){s-=2;el.style.fontSize=s+'px'}}
function render(D){
 document.getElementById('kick').textContent=D.kick;
 document.getElementById('ha').textContent=D.ha;
 document.getElementById('hb').textContent=D.hb;
 document.getElementById('lead').innerHTML=D.lead;
 document.getElementById('feats').innerHTML=D.feats.map(function(f){return '<div class="f"><i>'+sv(f[0])+'</i><p>'+f[1]+(f[2]?' <small>· '+f[2]+'</small>':'')+'</p></div>'}).join('');
 document.getElementById('app').innerHTML=S[D.screen](D.s);
 var ft=D.foot||[['bolt','تسليم سريع'],['shield','ضمان ذهبي']];
 document.getElementById('foot').innerHTML=ft.map(function(x){return '<span class="it">'+sv(x[0])+x[1]+'</span>'}).join('')+'<span class="site">fasterfollow.com</span>';
 fit(document.getElementById('hb'),92,56); fit(document.getElementById('ha'),50,34);
}
